services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uniforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniforge}
      POSTGRES_DB: ${POSTGRES_DB:-uniforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
